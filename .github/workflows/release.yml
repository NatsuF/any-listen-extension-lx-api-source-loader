name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master-quality

permissions:
  contents: write

jobs:
  Linux:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: corepack enable && npm install -g corepack@latest && pnpm install --frozen-lockfile

      - name: Verify signing keys
        env:
          PRI_KEY: ${{ secrets.PRI_KEY }}
          PUB_KEY: ${{ secrets.PUB_KEY }}
        run: |
          if [ -z "$PRI_KEY" ] || [ -z "$PUB_KEY" ]; then
            echo "::error::Missing repository secrets PRI_KEY / PUB_KEY. extension-kit refuses to pack without them."
            echo "::error::Add them in Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          echo "Signing keys present."

      - name: Type check
        continue-on-error: true
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.isolate.json --noEmit

      - name: Build src code
        env:
          PRI_KEY: ${{ secrets.PRI_KEY }}
          PUB_KEY: ${{ secrets.PUB_KEY }}
        run: npm run build

      - name: Get package info
        run: |
          node -p '`PACKAGE_VERSION=${require("./package.json").version}`' >> $GITHUB_ENV

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-api-source-loader_v${{ env.PACKAGE_VERSION }}
          path: ./build/*.alix

      - name: Create git tag
        continue-on-error: true
        uses: pkgdeps/git-tag-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: 'v'

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: true
          draft: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          files: |
            ./build/*.alix
            ./publish/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate file MD5
        run: |
          md5sum ./build/*.alix
